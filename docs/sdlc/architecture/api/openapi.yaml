      required:
      - id
      - order_item_id
      - event_id
      - qr_identifier
      - status
    audit_logs:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        action:
          type: string
        resource:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - action
      - resource
      - created_at

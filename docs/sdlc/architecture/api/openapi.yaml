      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        role:
          type: string
        display_name:
          type: string
        auth_provider:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - auth_provider
      - created_at
    consents:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        purpose:
          type: string
        granted:
          type: boolean
        granted_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - purpose
      - granted
      - granted_at
    password_reset_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - expires_at
    events:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        venue:
          type: string
        city:
          type: string
        starts_at:
          type: string
          format: date-time
        status:
          type: string
        banner_url:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - organizer_id
      - title
      - venue
      - starts_at
      - status
      - created_at
    ticket_types:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
        total_quantity:
          type: integer
        sold_quantity:
          type: integer
      required:
      - id
      - event_id
      - name
      - price
      - total_quantity
      - sold_quantity
    orders:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        order_reference:
          type: string
        status:
          type: string
        total_amount:
          type: number
        commission_amount:
          type: number
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
      required:
      - id
      - buyer_id
      - event_id
      - order_reference
      - status
      - total_amount
      - created_at
    order_items:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        ticket_type_id:
          type: string
          format: uuid
        quantity:
          type: integer
        unit_price:
          type: number
      required:
      - id
      - order_id
      - ticket_type_id
      - quantity
      - unit_price
    tickets:
      type: object
      properties:
        id:
          type: string
          format: uuid
